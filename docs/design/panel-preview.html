  var members={
    'queen':{name:'蚁后',model:'deepseek-v4',effort:'默认',state:'idle'},
    'worker-1':{name:'工蚁 1',model:'deepseek-v4-thinking',effort:'中',state:'running'},
    'worker-2':{name:'工蚁 2',model:'claude-sonnet-4.6',effort:'高',state:'idle'},
    'worker-3':{name:'工蚁 3',model:'gpt-5.2-codex',effort:'默认',state:'failed'}
  };
  var tasks={
    docs:{name:'文档迁移',state:'reviewed',word:'待放行',owner:'工蚁 1',cmd:'node --test tests/docs/terms.test.mjs'},
    cost:{name:'成本口径',state:'reviewed',word:'待放行',owner:'蚁后',cmd:'node --test tests/core/spend.test.mjs'},
    notes:{name:'发布说明',state:'pending',word:'未孵化',owner:'—',cmd:'—'},
    telemetry:{name:'遥测',state:'pending',word:'未孵化',owner:'—',cmd:'—'},
    contract:{name:'契约核对',state:'pending',word:'未孵化',owner:'—',cmd:'—'},
    verify:{name:'验证',state:'running',word:'在跑',owner:'工蚁 1',cmd:'node --test tests/core/gate.test.mjs'},
    core:{name:'重构核心',state:'running',word:'在跑',owner:'工蚁 2',cmd:'node --test tests/core/actions.test.mjs'},
    spec:{name:'规格',state:'released',word:'已入库',owner:'蚁后',cmd:'node --test tests/core/codec.test.mjs'},
    impl:{name:'实现',state:'released',word:'已入库',owner:'工蚁 1',cmd:'node --test tests/core/fold.test.mjs'},
    adapt:{name:'宿主适配',state:'released',word:'已入库',owner:'工蚁 2',cmd:'node --test tests/host/corridor.test.mjs'},
    legacy:{name:'旧门户',state:'failed',word:'废料',owner:'工蚁 3',cmd:'—'}
  };
  var catalog=[['deepseek-v4','deepseek'],['deepseek-v4-thinking','deepseek'],['claude-sonnet-4.6','anthropic'],['gpt-5.2-codex','openai-compat']];

  var sel={kind:'task',id:'docs'};
  var tt;
  function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on')},1700)}

  var GATES=[['需求','released','通过'],['实现','released','已交付'],['验证','running','在跑'],['审查','pending','未开始'],['集成','pending','未开始']];

  function renderRail(){
    var r=$('#rail');
    if(sel.kind==='task'){
      var t=tasks[sel.id];
      r.innerHTML='<h2>'+t.name+'</h2>'+
        '<div class="st"><i class="dot '+t.state+'"></i>'+t.word+'</div>'+
        '<div class="cmd">'+t.cmd+'</div>'+
        '<div class="acts">'+
          (t.state==='reviewed'?'<button class="btn amber" type="button" data-release>放行</button>':'')+
          (t.state==='running'?'<button class="btn" type="button" data-toast="已转派">转派</button><button class="btn" type="button" data-toast="已接管">接管</button>':'')+
          (t.state==='pending'?'<button class="btn" type="button" data-toast="已派给工蚁 1">派工</button>':'')+
          (t.state==='failed'?'<button class="btn" type="button" data-toast="已重试">重试</button>':'')+
        '</div>'+
        '<span class="cap">'+t.owner+' 持有</span>'+
        '<div class="rule"></div>'+
        '<span class="cap">五道门</span>'+
        GATES.map(function(g){return '<span class="ms"><i class="dot '+g[1]+'"></i><b>'+g[0]+'</b>'+g[2]+'</span>'}).join('');
    }else{
      var m=members[sel.id];
      r.innerHTML='<h2>'+m.name+'</h2>'+
        '<div class="st"><i class="dot '+m.state+'"></i>'+(m.state==='running'?'在岗':m.state==='idle'?'闲置':'暂停')+'</div>'+
        '<div class="acts"><button class="chip" type="button" data-model-for="'+sel.id+'">'+m.model+'</button>'+
        '<button class="chip" type="button" data-pick-effort>'+m.effort+'</button></div>'+
        '<div class="rule"></div>'+
        '<span class="cap">持有</span>'+
        Object.keys(tasks).filter(function(k){return tasks[k].owner===m.name}).map(function(k){
          return '<span class="ms"><i class="dot '+tasks[k].state+'"></i>'+tasks[k].name+'</span>';
        }).join('')+
        '<div class="rule"></div>'+
        '<div class="acts"><button class="btn" type="button" data-toast="已派工">派工</button>'+
        '<button class="btn" type="button" data-toast="已暂停">暂停</button></div>';
    }
    $$('.row').forEach(function(n){n.classList.toggle('sel',sel.kind==='task'&&n.dataset.task===sel.id)});
    $$('.ant').forEach(function(n){n.classList.toggle('sel',sel.kind==='member'&&n.dataset.member===sel.id)});
  }

  $('#draw').addEventListener('click',function(e){
    var r=e.target.closest?e.target.closest('.row[data-task]'):null;
    if(r){sel={kind:'task',id:r.dataset.task};renderRail();return}
    var a=e.target.closest?e.target.closest('.ant[data-member]'):null;
    if(a){sel={kind:'member',id:a.dataset.member};renderRail();}
  });

  var pop=$('#pop'),antBtn=$('#antBtn'),pin=false,hi,ho;
  function renderRoster(){
    var box=$('#roster');box.innerHTML='';
    Object.keys(members).forEach(function(id){
      var m=members[id];
      var row=document.createElement('div');row.className='mrow';
      row.innerHTML='<i class="dot '+m.state+'"></i><span class="nm">'+m.name+'</span>'+
        '<span class="push"><button class="chip" type="button" data-model-for="'+id+'">'+m.model+'</button></span>';
      box.appendChild(row);
    });
  }
  function place(){
    var r=antBtn.getBoundingClientRect();
    pop.style.top=(r.bottom+9)+'px';
    pop.style.left=Math.max(12,Math.min(r.right-306,window.innerWidth-318))+'px';
  }
  function openPop(){place();pop.classList.add('on');antBtn.setAttribute('aria-expanded','true')}
  function closePop(force){if(pin&&force!==true)return;pop.classList.remove('on');antBtn.setAttribute('aria-expanded','false');pin=false}
  antBtn.addEventListener('mouseenter',function(){clearTimeout(ho);hi=setTimeout(openPop,150)});
  antBtn.addEventListener('mouseleave',function(){clearTimeout(hi);ho=setTimeout(function(){closePop(false)},130)});
  pop.addEventListener('mouseenter',function(){clearTimeout(ho)});
  pop.addEventListener('mouseleave',function(){ho=setTimeout(function(){closePop(false)},130)});
  antBtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(pop.classList.contains('on')&&pin){closePop(true);return}
    pin=true;openPop();var c=$('.chip',pop);if(c)c.focus();
  });
  document.addEventListener('click',function(e){
    if(pop.contains(e.target)||antBtn.contains(e.target)||$('#picker').contains(e.target))return;
    closePop(true);hidePicker();
  });

  var picker=$('#picker'),forId=null;
  function showPicker(chip,kind){
    forId=chip.dataset.modelFor||(sel.kind==='member'?sel.id:null);
    var m=members[forId],opts=$('#opts'),efforts=$('#efforts');
    if(kind==='effort'){opts.innerHTML='';opts.hidden=true;efforts.hidden=false;}
    else{
      opts.hidden=false;efforts.hidden=false;opts.innerHTML='';
      catalog.forEach(function(c){
        var o=document.createElement('div');o.className='opt'+(m.model===c[0]?' sel':'');
        o.innerHTML='<span>'+c[0]+'</span><span class="s">'+c[1]+'</span>';
        o.addEventListener('click',function(){m.model=c[0];renderRoster();renderRail();toast(m.name+' 换到 '+c[0]);hidePicker()});
        opts.appendChild(o);
      });
    }
    $$('#efforts button').forEach(function(b){b.classList.toggle('on',b.dataset.effort===m.effort)});
    var r=chip.getBoundingClientRect();
    picker.classList.add('on');
    picker.style.top=Math.min(r.bottom+6,window.innerHeight-200)+'px';
    picker.style.left=Math.max(10,Math.min(r.left-150,window.innerWidth-260))+'px';
  }
  function hidePicker(){picker.classList.remove('on');forId=null}
  $$('#efforts button').forEach(function(b){
    b.addEventListener('click',function(){
      $$('#efforts button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
      if(forId){members[forId].effort=b.dataset.effort;renderRail();toast('思考强度 '+b.dataset.effort)}
      hidePicker();
    });
  });

  document.addEventListener('click',function(e){
    var chip=e.target.closest?e.target.closest('[data-model-for]'):null;
    if(chip){e.stopPropagation();showPicker(chip);return}
    var eff=e.target.closest?e.target.closest('[data-pick-effort]'):null;
    if(eff){e.stopPropagation();showPicker(eff,'effort');return}
    var rel=e.target.closest?e.target.closest('[data-release]'):null;
    if(rel){toast('已放行 2 项');return}
    var say=e.target.closest?e.target.closest('[data-toast]'):null;
    if(say)toast(say.dataset.toast);
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){hidePicker();closePop(true)}});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var t=e.target.closest?e.target.closest('.row[data-task],.release'):null;
    if(!t)return;
    e.preventDefault();
    if(t.dataset.task){sel={kind:'task',id:t.dataset.task};renderRail()}
    else toast('已放行 2 项');
  });

  var colony=$('#colony'),session=$('#session');
  function setView(v){
    var nest=(v!=='chat'&&v!=='pop');
    colony.hidden=!nest;session.hidden=nest;
    $('#vNest').setAttribute('aria-selected',nest?'true':'false');
    $('#vChat').setAttribute('aria-selected',v==='chat'?'true':'false');
    $('#vPop').setAttribute('aria-selected',v==='pop'?'true':'false');
    if(v==='pop'){pin=true;requestAnimationFrame(function(){openPop()})}
    else closePop(true);
  }
  $('#vNest').addEventListener('click',function(){setView('nest')});
  $('#vChat').addEventListener('click',function(){setView('chat')});
  $('#vPop').addEventListener('click',function(){setView('pop')});
  $$('[data-nest]').forEach(function(b){b.addEventListener('click',function(){setView('nest')})});
  $('#themeBtn').addEventListener('click',function(){
    var dark=document.documentElement.dataset.theme!=='dark';
    document.documentElement.dataset.theme=dark?'dark':'light';
    this.textContent=dark?'白版':'夜城';
  });
  window.addEventListener('resize',function(){if(pop.classList.contains('on'))place()});

  function applyHash(){
    var h=(location.hash||'').replace('#','')||'nest';
    var dark=h.indexOf('-light')<0;
    var v=h.replace('-dark','').replace('-light','');
    document.documentElement.dataset.theme=dark?'dark':'light';
    $('#themeBtn').textContent=dark?'白版':'夜城';
    if(v==='chat'||v==='pop')setView(v);else setView('nest');
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){var svg=$('#draw svg');if(svg)svg.pauseAnimations()}
  }
  window.addEventListener('hashchange',applyHash);
  renderRoster();renderRail();applyHash();
})();
</script></body></html>
